<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Mundial 2026</h1>

  <div id="menu">
    <button onclick="verSeccion('partidos')">Partidos</button>
    <button onclick="verSeccion('jugadores')">Jugadores</button>
    <button onclick="verSeccion('equipos')">Equipos</button>
  </div>

  <div id="seccionPartidos">
    <h2>Partidos</h2>
    <div id="barraPartidos">
      <input type="text" id="buscarPartido" placeholder="Buscar equipo...">
      <button id="btnFiltrar">Filtrar</button>
    </div>
    <div id="panelFiltros">
      <label>Fecha: <input type="date" id="filtroFecha"></label>
      <label>Estadio: <select id="filtroEstadio"><option value="">Todos los estadios</option></select></label>
      <button id="btnLimpiarFiltros">Limpiar</button>
    </div>
    <div id="partidos">Cargando partidos...</div>
  </div>

  <div id="seccionJugadores">
    <h2>Jugadores</h2>
    <p>Escribe un pais EN INGLES (Spain, Argentina, Brazil, France...)</p>
    <input type="text" id="pais" placeholder="Spain">
    <button id="btnBuscarJugadores">Buscar</button>
    <div id="jugadores"></div>
  </div>

  <div id="seccionEquipos">
    <h2>Equipos</h2>
    <div id="barraEquipos">
      <button id="btnFiltrarEquipos">Filtrar</button>
    </div>
    <div id="panelFiltrosEquipos">
      <label>País: <select id="filtroPais"><option value="">Todos los países</option></select></label>
      <label>Grupo: <select id="filtroGrupo"><option value="">Todos los grupos</option></select></label>
      <button id="btnLimpiarFiltrosEquipos">Limpiar</button>
    </div>
    <div id="equipos">Cargando equipos...</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
